- title: "Punishing the Foreigner: Implicit Discrimination in the Premier League Based on Oppositional Identity*"
  authors: "E. Gallo, T. Grund, J. J. Reade"
  venue: "Oxford Bulletin of Economics and Statistics"
  year: 2012
  type: article
  doi: "https://doi.org/10.1111/j.1468-0084.2012.00725.x"
  hue: 52
  abstract: "We present the first empirical study to reveal the presence of implicit discrimination in a non‐experimental setting. By using a large dataset of in‐match data in the English Premier League, we show that white referees award significantly more yellow cards against non‐white players of oppositional identity. We argue that this is the result of implicit discrimination by showing that this discriminatory behaviour: (i) increases in how rushed the referee is before making a decision, and (ii) it increases in the level of ambiguity of the decision. The variation in (i) and (ii) cannot be explained by any form of conscious discrimination such as taste‐based or statistical discrimination. Moreover, we show that oppositional identity players do not differ in their behaviour from other players along several dimensions related to aggressiveness and style of play providing further evidence that this is not statistical discrimination."
  featured: false

- title: "Ethnic heterogeneity in the activity and structure of a Black street gang"
  authors: "T. Grund, J. A. Densley"
  venue: "European Journal of Criminology"
  year: 2012
  type: article
  doi: "https://doi.org/10.1177/1477370812447738"
  hue: 184
  abstract: "Despite acknowledgment of ‘hybrid’ street gangs in the literature, there is little systematic research into ethnic heterogeneity within gangs. This research aims at moving beyond the broad categorization of the Black street gang. For this purpose, we examine an all-Black London-based gang in detail, using fieldwork and police arrest data, and investigate the role of ethnic heterogeneity for the workings of the gang. Our findings suggest that ethnic heterogeneity within this gang is crucial for its criminal operation. Although there is no evidence for ethnicity-related specialization of crime, the structural co-offending pattern of the gang’s activities is dominated by ethnicity. Ethnicity matters for who offends with whom."
  featured: false

- title: "Network Dynamics and Market Structure: The Case of Art Fairs"
  authors: "T. Yogev, T. Grund"
  venue: "Sociological Focus"
  year: 2012
  type: article
  doi: "https://doi.org/10.1080/00380237.2012.630846"
  hue: 117
  abstract: "Annual art fairs are a crucial element of the contemporary art market. Art galleries represent artists and exhibit their work at fairs all over the world. These fairs expose the gallery and its artists and create and maintain relationships with key actors in the global art market. Using data recording artists and galleries presenting at art fairs alongside qualitative interviews with different actors operating in the art market, we study the development of the art fair network over three years, 2005–2007. Our findings suggest significant network and homophily effects regarding the status and age of artists at fairs. However, the internationality of fairs and geographic distances between them do not seem to have any effect."
  featured: false
