- title: "Some friends matter more than others: BMI clustering among adolescents in four European countries"
  authors: "T. Grund, T. Tatum"
  venue: "Network Science"
  year: 2019
  type: article
  doi: "https://doi.org/10.1017/nws.2018.20"
  hue: 121
  abstract: "Previous research stresses the importance of social networks for obesity. We draw on friendship data from 18,133 adolescents in four European countries to investigate the relationship between individuals’ body mass index (BMI) and the BMI of their friends. Our study reveals strong evidence for BMI clustering in England, Germany, the Netherlands, and Sweden; adolescents tend to be friends with others who have a similar BMI. Furthermore, we extend current debate and explore friendship characteristics that moderate the relationship between social networks and BMI. We demonstrate that BMI clustering is more pronounced in (1) strong compared to weak friendships and (2) between adolescents of the same biological sex. These findings indicate thatmore research on social networks and health is needed which distinguishes between different kinds of relationships."
  featured: false

- title: "Residential Segregation and ‘Ethnic Flight’ vs. ‘Ethnic Avoidance’ in Sweden"
  authors: "T. Müller, T. Grund, J. H. Koskinen"
  venue: "European Sociological Review"
  year: 2018
  type: article
  doi: "https://doi.org/10.1093/esr/jcy010"
  hue: 290
  abstract: "Residential segregation along ethnic categories has been associated with social disadvantages of minority group members. It is considered a driving factor in the reproduction of social inequalities and a pressing issue in many societies. While most research focuses on neighbourhood segregation in the United States, less is known about the origins of ethnic enclaves in European cities. We use complete data of residential moves within Stockholm municipality between 1990 and 2003 to test whether ‘ethnic flight’ or ‘ethnic avoidance’ drives segregation dynamics. On the macro level, we analyse the binary infrastructure of natives’ and immigrants’ movement flows between 128 neighbourhoods with exponential random graph models, which account for systemic dependencies in the structure of the housing market. On the micro level, we analyse individual-level panel data to account for differences between native and immigrant in- and out-movers. Our results show strong support for ‘ethnic avoidance’ on both levels—native Swedes avoid moving into neighbourhoods where ethnic minorities live. This is even more pronounced when controlling for socio-economic factors. At the same time, there is only little support for ‘ethnic flight’ on the micro level—native Swedes are only marginally more likely to move out of neighbourhoods where many immigrants live."
  featured: false

- title: "The Relational Value of Network Experience in Teams: Evidence From the English Premier League"
  authors: "T. Grund"
  venue: "American Behavioral Scientist"
  year: 2016
  type: article
  doi: "https://doi.org/10.1177/0002764216643133"
  hue: 96
  abstract: "Previous studies indicate the importance of experience for the performance of teams. Theory suggests that working together allows individuals to (a) improve their knowledge about who knows (and can do) what and (b) facilitates learning to combine individual resources efficiently. Yet it remains elusive how experience translates into interaction patterns in teams. Drawing on unique data of career histories of 800 players and 283,259 passes between these players in 760 English Premier League soccer matches, I propose a new measure for network experience and demonstrate how it relates to network intensity and decentralization in teams. Soccer teams exhibit a higher passing rate when players know each other from before. At the same time, network experience has no effect on the decentralization of team play. Further dyadic analyses confirm these findings. Controlling for selection effects, two players are more likely to pass the ball between each other when they know each other more. Network experience affects the way team members interact and ultimately leads to performance outcomes."
  featured: false

- title: "Ethnic Homophily and Triad Closure: Mapping Internal Gang Structure Using Exponential Random Graph Models"
  authors: "T. Grund, J. A. Densley"
  venue: "Journal of Contemporary Criminal Justice"
  year: 2014
  type: article
  doi: "https://doi.org/10.1177/1043986214553377"
  hue: 250
  abstract: "Previous studies indicate the importance of similarities between street gang members in terms of ethnicity for mapping the patterns of co-offending relationships within gangs. Individual members are more likely to co-offend with other members who are from the same ethnicity. Past studies, however, do not appropriately account for the fact that correlation between attributes of co-offending gang members may be driven by alternative mechanisms. Most importantly, the presence of clustering in networks can dramatically affect the assessment and make us believe that homophily—the deliberate choice to co-offend with others from the same ethnic group—is important while in fact it is not. In this article, we recreate the internal structure of a London-based street gang with exponential random graph (ERG) models. Our results refine the role of ethnicity for co-offending within gangs. While homophily is still prevalent, the effect diminishes when triad closure—the tendency for two individuals to offend with each other when they also offend with a common third person—is considered. Furthermore, we extend existing ERG specifications and investigate the interaction between ethnic homophily and triad closure. Findings indicate that ethnic homophily is even stronger when it is embedded in co-offending triads."
  featured: false

- title: "Multidimensional homophily in friendship networks"
  authors: "P. Block, T. Grund"
  venue: "Network Science"
  year: 2014
  type: article
  doi: "https://doi.org/10.1017/nws.2014.17"
  hue: 121
  abstract: "Homophily - the tendency for individuals to associate with similar others - is one of the most persistent findings in social network analysis. Its importance is established along the lines of a multitude of sociologically relevant dimensions, e.g. sex, ethnicity and social class. Existing research, however, mostly focuses on one dimension at a time. But people are inherently multidimensional, have many attributes and are members of multiple groups. In this article, we explore such multidimensionality further in the context of network dynamics. Are friendship ties increasingly likely to emerge and persist when individuals have an increasing number of attributes in common? We analyze eleven friendship networks of adolescents, draw on stochastic actor-oriented network models and focus on the interaction of established homophily effects. Our results indicate that main effects for homophily on various dimensions are positive. At the same time, the interaction of these homophily effects is negative. There seems to be a diminishing effect for having more than one attribute in common. We conclude that studies of homophily and friendship formation need to address such multidimensionality further."
  featured: false

