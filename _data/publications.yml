- title: "nwsaom: Stochastic actor-oriented models in Stata. Manual"
  authors: "T. U. Grund"
  venue: "Software manual (Zenodo)"
  year: 2026
  type: software
  doi: "https://doi.org/10.5281/zenodo.23623807"
  hue: 128
  abstract: "This is the manual for nwsaom, a Stata package that estimates stochastic actor-oriented models (SAOMs, also called Siena models) for panel network data. nwsaom follows the R package RSiena: it uses the same model, effects, method-of-moments algorithm, defaults and output, and it adds maximum-likelihood and Bayesian estimation following multiSiena. Everything runs inside Stata, with the simulations in a compiled, multithreaded plugin. The manual describes the syntax and every option, the effect library with its RSiena names (> 90% effects of RSiena's effects table that fall within what nwsaom covers), network-behavior co-evolution, undirected and two-mode networks, several networks and behaviors, rate effects, missing data and composition change, goodness of fit, score tests, tests for time heterogeneity, effect importance and meta-analysis of separate groups. It also documents the validation against RSiena, the behaviors of RSiena that nwsaom reproduces, the stored results, and worked examples with the Glasgow friendship data. nwsaom requires the nwcommands core package. It is meant for researchers who work in Stata or prefer it to R. It is not a replacement for RSiena, which remains the reference implementation and the more complete program, and it is not affiliated with or endorsed by the Siena project. The software is free software under the GNU General Public License, version 3. Please cite this manual and report the version printed by nwsaom version."
  featured: false

