- title: "Cross-national and historical variation in relative age effects in professional football"
  authors: "T. U. Grund"
  venue: "PLoS ONE"
  year: 2026
  type: article
  doi: "https://doi.org/10.1371/journal.pone.0354928"
  hue: 88
  abstract: "The relative age effect (RAE) - the overrepresentation of players born early in the selection year - is one of the most robust findings in sports science, yet how much it varies across countries and over time remains surprisingly underexplored. Drawing on birth-date data for 49,578 male professional footballers across 44 national systems and five birth cohorts (1985-2009), this study describes three patterns that have not previously been examined together. RAE magnitude varies enormously across national football systems, ranging from close to zero to birth-quarter gaps exceeding 40 percentage points. It has also increased across successive birth cohorts: players born in 2005-2009 show birth-quarter imbalances roughly 9 percentage points wider than those born in 1985-1989. Common macro-level indicators - national footballing strength, gross domestic product (GDP) per capita, and population - show at most weak and inconsistent associations with cross-national differences in RAE and do not account for the historical increase once country and cohort are held fixed. Together, these findings provide a comparative benchmark for understanding cross-national and historical variation in relative age effects."
  featured: true

- title: "Negative emotions concentrate while positive emotions diffuse in football fan rivalries"
  authors: "T. U. Grund"
  venue: "PLoS ONE"
  year: 2026
  type: article
  doi: "https://doi.org/10.1371/journal.pone.0356757"
  hue: 98
  abstract: "BACKGROUND: Research on negativity bias demonstrates that negative information receives disproportionate cognitive attention at the individual level, but how this psychological mechanism shapes collective emotional patterns remains unclear. We investigate whether communities systematically concentrate negative emotions on fewer targets while distributing positive emotions more broadly. METHODS: We analyze 36,223 German football fans' reports of loved and hated clubs, measuring attention concentration using the Herfindahl-Hirschman Index (HHI). We distinguish between outgoing concentration (how communities allocate their own attention) and incoming concentration (how attention from others focuses on particular targets), testing whether concentration differs between positive and negative affect. RESULTS: Negative attention was significantly more concentrated than positive attention for both outgoing (M = 0.36 vs M = 0.23, p < 0.001) and incoming ties (M = 0.41 vs M = 0.33, p = 0.011). Love and hate concentration are weakly correlated (r = 0.26-0.32), indicating independent processes. Structural factors predict incoming but not outgoing concentration (Pseudo R2 = 0.14-0.35 vs R2 = 0.47-0.49), revealing asymmetric mechanisms of attention allocation versus attraction. CONCLUSIONS: Communities face cognitive constraints that produce systematic asymmetries in how they distribute emotional attention. These findings highlight how cognitive constraints shape collective emotional structures, with implications for political polarization, consumer behavior, and conflict dynamics."
  featured: true

- title: "Evolving homophily in higher education: how university settings transform international student relationships"
  authors: "T. Grund, A. Tiernan, B. A. Negrea"
  venue: "British Journal of Sociology of Education"
  year: 2026
  type: article
  doi: "https://doi.org/10.1080/01425692.2026.2679479"
  hue: 270
  abstract: "Homophily research traditionally examines which similarities predict tie formation. This study extends this perspective by investigating how the foundations of homophilous relationships evolve over time through sustained institutional interaction. Drawing on in-depth interviews with international students at a German university, we analyse how educational settings enable relationships—initially grounded in one similarity (e.g. nationality, language)—to develop additional bases (e.g. shared values, emotional bonds). We identify four mechanisms—shared vulnerability, language lock-in, ritual anchoring, and material frictions—through which strategic connections evolve into multidimensional relationships. Rather than a sign of integration failure, co-national ties often serve as staging grounds for broader network development. Our findings suggest that curricular design and institutional temporality, not merely contact opportunities, shape meaningful cross-group connections that enhance belonging and academic success."
  featured: true

