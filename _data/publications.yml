- title: "Birds of a feather at first sight: Decomposing homophily into tie formation and persistence"
  authors: "T. U. Grund"
  venue: "Social Networks"
  year: 2026
  type: article
  doi: "https://doi.org/10.1016/j.socnet.2026.08.002"
  hue: 60
  abstract: "Why do some social ties endure while others dissolve? Homophily research typically treats similarity as a single mechanism, conflating processes of tie formation and persistence. I develop a framework based on attribute observability, distinguishing between observable characteristics that guide formation under uncertainty and interaction-revealed attributes that shape tie retention. Using three-wave longitudinal friendship network data and Stochastic Actor-Oriented Models, I decompose homophily into creation and endowment effects across 28 grade networks. Observable attributes (gender, ethnicity) show strong formation effects but little persistence advantage. Interaction-revealed attributes show weaker and less precise patterns. These findings demonstrate that homophily is an information-conditional process and that standard models obscure its underlying mechanisms."
  featured: true

- title: "One body, many identities: a mathematical model of multidimensional segregation dynamics"
  authors: "T. U. Grund"
  venue: "Journal of Mathematical Sociology"
  year: 2026
  type: article
  doi: "https://doi.org/10.1080/0022250x.2026.2670311"
  hue: 48
  abstract: "Individuals inhabit multiple social roles – citizen, neighbor, worker – but make residential decisions with a single body. Classic segregation models assume fixed, singular identities. This paper extends Schelling’s model by introducing agents with multidimensional identities and salience rules that determine which identity guides behavior. Across 1,920 simulations, we show that coordination failures produce persistent dissatisfaction and instability, while attention alignment can reduce or concentrate segregation. These findings challenge the assumption that identity complexity promotes integration. Instead, spatial outcomes depend on how identity salience is cognitively and socially managed. The model contributes to mathematical sociology and formal intersectionality by revealing how behavioral coordination mechanisms shape emergent patterns of segregation."
  featured: false

- title: "Social media use and adolescent depressive symptoms: The moderating roles of gender and parental monitoring"
  authors: "T. U. Grund, H. Krüger, I. Pascu"
  venue: "International Journal of Mental Health and Addiction"
  year: 2025
  type: article
  doi: "https://doi.org/10.1007/s11469-025-01566-3"
  hue: 24
  abstract: "Social media use has significantly reshaped adolescents’ social experiences, raising substantial concerns about its impact on mental health. This study examines the association between social media usage intensity and depressive symptoms among adolescents, emphasizing the moderating roles of parental monitoring and gender. Using logistic regression analysis of the 2023 US Youth Risk Behavior Survey ( N = 10,334), results reveal that moderate and high social media use significantly increases depressive symptoms. Notably, higher parental monitoring mitigates these adverse effects. While females exhibit higher depressive symptoms overall, gender does not significantly moderate social media’s impact. This study highlights the importance of nuanced parental engagement and offers critical insights for policymakers and educators to foster healthier digital environments for adolescents."
  featured: false

- title: "Harmony on the Plate: Peer Networks and the Evolution of Adolescent Vegetarian Identities"
  authors: "H. Krüger, R. Severijns, T. Grund, A. Tiernan, R. Hellpap"
  venue: "OSF preprint"
  year: 2025
  type: preprint
  doi: "https://doi.org/10.31234/osf.io/ndtrm_v2"
  hue: 183
  abstract: "Adolescence is a formative period for the development of dietary behaviors, yet little is known about how peer relationships shape vegetarianism during this life stage. Existing research on food-related peer influence has largely relied on cross-sectional or perceptual measures, limiting the ability to disentangle social influence from friendship selection processes. Drawing on theories of social influence and social selection, this study examines the co-evolution of friendship networks and vegetarianism adoption and maintenance among adolescents.Data stem from the longitudinal SOCIALBOND study conducted in North Rhine-Westphalia, Germany, comprising 1,372 students across 22 school cohorts followed from seventh to eighth grade. Using sociometric friendship network data and stochastic actor-oriented models (RSiena), we simultaneously model changes in friendship ties and vegetarianism to disentangle peer influence and friendship selection dynamics.Peer influence processes emerged more clearly than friendship selection effects. Adolescents in smaller grade-level networks were significantly more likely to maintain vegetarianism when they were connected to more vegetarian peers. No comparable influence effects were observed for the adoption of vegetarianism or within larger grade-level networks. Hence, friendship networks primarily reinforced existing vegetarianism rather than promoting new adoption. Results provide little evidence for friendship selection based on vegetarianism. In smaller year groups, vegetarianism did not significantly shape friendship formation or maintenance. In larger year groups, vegetarian-identifying adolescents were less likely to initiate new friendships, but more likely to maintain existing ties over time.These findings highlight that adolescent vegetarianism is socially embedded, but that peer dynamics operate mainly through reinforcement mechanisms and vary across network contexts."
  featured: false

